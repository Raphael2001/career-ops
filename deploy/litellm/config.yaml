# LiteLLM proxy config -- fronts NVIDIA NIM's free-tier Nemotron model behind
# an Anthropic-compatible /v1/messages endpoint, so `claude` (Claude Code CLI)
# can point ANTHROPIC_BASE_URL at this proxy instead of api.anthropic.com.
#
# NVIDIA_API_KEY is read from the environment (set in .env on the host, never
# committed). See deploy/litellm/README.md for how to point Claude Code at
# this proxy once it's running.

model_list:
  - model_name: nemotron-lightning
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b
      api_key: os.environ/NVIDIA_API_KEY
      api_base: https://integrate.api.nvidia.com/v1

  # Better fit for genuinely agentic, multi-step tool-use work (e.g. the
  # Level-1 Playwright job-extraction loop in discover-companies.sh) --
  # 561B params, 1M context, NVIDIA's own listing calls out "agentic
  # reasoning, coding, planning, tool calling" specifically, unlike
  # nemotron-lightning which is tuned for speed/cost on shorter, narrower
  # calls. Verified live on the Free Endpoint tier, no separate access
  # request needed (unlike moonshotai/kimi-k2.6, which is listed by NIM's
  # own API but has no public onboarding path -- 404s "not found for
  # account" even with a valid key).
  - model_name: agent-model
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY
      api_base: https://integrate.api.nvidia.com/v1

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
