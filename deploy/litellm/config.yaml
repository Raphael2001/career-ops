# LiteLLM proxy config -- fronts NVIDIA NIM's free-tier Nemotron model behind
# an Anthropic-compatible /v1/messages endpoint, so `claude` (Claude Code CLI)
# can point ANTHROPIC_BASE_URL at this proxy instead of api.anthropic.com.
#
# NVIDIA_API_KEY is read from the environment (set in .env on the host, never
# committed). See deploy/litellm/README.md for how to point Claude Code at
# this proxy once it's running.
#
# model_name below is each provider's own real model id (not a made-up
# alias) -- what you set ANTHROPIC_MODEL/CLAUDE_HEADLESS_MODEL is exactly
# what that provider calls the model.

model_list:
  # Cloudflare Workers AI -- included in the Workers Free plan with a daily
  # quota. It is used only after the existing free-provider fallbacks fail.
  - model_name: cloudflare/@cf/zai-org/glm-4.7-flash
    litellm_params:
      model: cloudflare/@cf/zai-org/glm-4.7-flash
      api_key: os.environ/CLOUDFLARE_API_TOKEN
      # No AI Gateway configured on the account -- routing through
      # cf-aig-gateway-id without one existing 400s with "Please configure
      # AI Gateway in the Cloudflare dashboard" (code 2001). Calling Workers
      # AI direct instead.

  # 561B params, 1M context, NVIDIA's own listing calls out "agentic
  # reasoning, coding, planning, tool calling" specifically -- the fit for
  # career-ops's actual usage (multi-step tool-use agent runs, not narrow
  # single-shot calls). Verified live on the Free Endpoint tier, no separate
  # access request needed (unlike moonshotai/kimi-k2.6, which is listed by
  # NIM's own API but has no public onboarding path -- 404s "not found for
  # account" even with a valid key).
  #
  # nemotron-3.5-lightning-30b-a3b (smaller/faster, tuned for shorter, less
  # agentic calls) used to sit alongside this one, but it shares NVIDIA_API_KEY
  # and quota with it -- a 429 on one from that account's rate limit is a 429
  # on both, so it added a fallback-chain entry without adding real
  # redundancy. Dropped; NVIDIA now has exactly one entry here.
  - model_name: nvidia/nemotron-3-ultra-550b-a55b
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY
      api_base: https://integrate.api.nvidia.com/v1

  # Groq -- fast free-tier inference, independent key/quota. Verified live
  # against GET https://api.groq.com/openai/v1/models on 2026-08-22 --
  # llama-3.3-70b-versatile (the previous pick) has since been removed from
  # Groq's catalog; gpt-oss-120b is Groq's current largest general/
  # tool-calling model, listed under this exact id in Groq's own catalog.
  - model_name: openai/gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  # OpenRouter -- broad free-tier catalog, independent key/quota. Verified
  # live against GET https://openrouter.ai/api/v1/models (prompt/completion
  # pricing == "0") on 2026-08-22 -- the previous pick
  # (meta-llama/llama-3.3-70b-instruct:free) has since gone paid-only.
  # Picked the OpenRouter-hosted twin of nvidia/nemotron-3-ultra-550b-a55b
  # above (same weights) so quality doesn't regress on fallback, just the
  # provider/key. model_name carries the :free suffix because that's part
  # of OpenRouter's own catalog id -- drop it and you're naming a paid
  # model that costs money per call.
  # OPENROUTER_API_KEY is shared with openrouter-runner.mjs (see .env.example).
  - model_name: nvidia/nemotron-3-ultra-550b-a55b:free
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Z.ai (GLM) -- direct api.z.ai, not OpenRouter. glm-5.x/glm-4.5/glm-4.6/
  # glm-4.7 (the models listed by GET https://api.z.ai/api/paas/v4/models)
  # are pay-as-you-go and 429 "Insufficient balance or no resource package"
  # on a $0 account. glm-4.7-flash is a genuinely free model that ISN'T
  # listed by that endpoint at all -- confirmed via Z.ai's own docs
  # (docs.z.ai) and a live test call, both on 2026-08-22. Independent
  # key/quota from every other model above.
  - model_name: glm-4.7-flash
    litellm_params:
      model: openai/glm-4.7-flash
      api_key: os.environ/ZAI_API_KEY
      api_base: https://api.z.ai/api/paas/v4/

  # Mistral (La Plateforme) -- independent key/quota. Verified live via
  # actual test calls on 2026-08-22 (mistral-small-latest,
  # ministral-8b-latest, mistral-large-latest, and devstral-latest all
  # returned 200 on this account) -- picked mistral-small-latest as the
  # one Mistral's own docs describe as free-tier eligible; the others
  # working too may just reflect this account's current trial credits
  # rather than a guaranteed-free tier long-term.
  - model_name: mistral-small-latest
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY

litellm_settings:
  drop_params: true
  # On a 429 (rate limit), retry against the fallback chain, one model
  # scored on this priority order. Cloudflare sits SECOND in every chain
  # (right after the primary), not last -- it's the only provider here on a
  # paid gateway rather than a free tier, so trying it early gets a real
  # answer fast instead of burning through four more free-tier providers
  # first; the remaining free providers still back it up if it also fails.
  # nvidia/nemotron-3-ultra-550b-a55b -> cloudflare/glm-4.7-flash
  #   -> openai/gpt-oss-120b -> nvidia/nemotron-3-ultra-550b-a55b:free
  #   -> glm-4.7-flash -> mistral-small-latest
  #
  # GitHub Models (gpt-4o) was here as a 6th fallback but was dropped --
  # GitHub is retiring the service entirely (github_models_retirement_
  # brownout on every request as of 2026-08-22), not a transient outage.
  # GITHUB_API_KEY / GH_MODELS_API_KEY are unused now; safe to delete if
  # you want to tidy up the repo secret and .env line.
  fallbacks:
    - cloudflare/@cf/zai-org/glm-4.7-flash: ["nvidia/nemotron-3-ultra-550b-a55b", "openai/gpt-oss-120b", "nvidia/nemotron-3-ultra-550b-a55b:free", "glm-4.7-flash", "mistral-small-latest"]
    - nvidia/nemotron-3-ultra-550b-a55b: ["cloudflare/@cf/zai-org/glm-4.7-flash", "openai/gpt-oss-120b", "nvidia/nemotron-3-ultra-550b-a55b:free", "glm-4.7-flash", "mistral-small-latest"]
    - openai/gpt-oss-120b: ["cloudflare/@cf/zai-org/glm-4.7-flash", "nvidia/nemotron-3-ultra-550b-a55b:free", "glm-4.7-flash", "mistral-small-latest", "nvidia/nemotron-3-ultra-550b-a55b"]
    - nvidia/nemotron-3-ultra-550b-a55b:free: ["cloudflare/@cf/zai-org/glm-4.7-flash", "openai/gpt-oss-120b", "glm-4.7-flash", "mistral-small-latest", "nvidia/nemotron-3-ultra-550b-a55b"]
    - glm-4.7-flash: ["cloudflare/@cf/zai-org/glm-4.7-flash", "openai/gpt-oss-120b", "nvidia/nemotron-3-ultra-550b-a55b:free", "mistral-small-latest", "nvidia/nemotron-3-ultra-550b-a55b"]
    - mistral-small-latest: ["cloudflare/@cf/zai-org/glm-4.7-flash", "openai/gpt-oss-120b", "nvidia/nemotron-3-ultra-550b-a55b:free", "glm-4.7-flash", "nvidia/nemotron-3-ultra-550b-a55b"]
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Keep request/response details in the LiteLLM UI, then remove them
  # automatically to limit retention of CV and job-search content.
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  maximum_spend_logs_retention_period: "30d"
  maximum_spend_logs_retention_interval: "1d"
