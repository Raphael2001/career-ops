services:
  career-ops:
    build:
      context: .
      dockerfile: Dockerfile
    image: career-ops:local
    container_name: career-ops
    working_dir: /app
    # Builds + starts the web UI in the background, then keeps a long-running
    # shell so `docker compose exec` (via ./cops) stays instant for CLI tasks.
    command: ["/app/deploy/container-start.sh"]
    init: true
    # Host 4000 -> container 3000 (the web app's own `next start` port).
    # Not host port 3000 so it doesn't collide with other services on the box.
    ports:
      - "4000:3000"
    # Mount whole project so edits on host are visible inside the container.
    # node_modules is kept inside the image to avoid host/container ABI mismatch
    # (host is ubuntu26.04 where playwright won't install; image is jammy).
    volumes:
      - .:/app
      - career-ops-node-modules:/app/node_modules
      - career-ops-web-node-modules:/app/web/node_modules
    environment:
      - NODE_ENV=development
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      # Forward common API keys if set on host. Empty values are ignored.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      # Write APIs are loopback-only by default. Add a trusted LAN hostname or
      # IP in .env when the dashboard is intentionally accessed over the LAN.
      - CAREER_OPS_WEB_ALLOWED_HOSTS=${CAREER_OPS_WEB_ALLOWED_HOSTS:-}
      # Default every `claude` call in this container -- including the web
      # UI's built-in Ask chat (/api/run, spawns `claude -p` directly) -- to
      # the LiteLLM/NVIDIA proxy, since there's no browser here for a real
      # interactive Anthropic login. If you ever DO set a real
      # ANTHROPIC_API_KEY/BASE_URL/MODEL in .env, those win instead (`:-`
      # only falls back when the left side is unset), so this doesn't get in
      # the way of switching to a real subscription later.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-${LITELLM_MASTER_KEY:-}}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-http://litellm:4000}
      # career-ops/top3 = load-balanced pool across nvidia nemotron,
      # OpenRouter stealth/ox-alpha, Cloudflare glm-4.7-flash -- see
      # deploy/litellm/config.yaml and deploy/litellm/README.md.
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-career-ops/top3}
    # Chromium needs a larger /dev/shm than the default 64M.
    shm_size: "1gb"
    # Dashboard TUI is interactive; expose nothing by default but allow `-it`.
    tty: true
    stdin_open: true
    restart: unless-stopped
    # Caps a runaway container instead of letting it exhaust the host and
    # take everything else down with it -- this host has genuinely done
    # that (mp3-summarizer's llamacpp container hit 6GB+ and OOM-killed
    # unrelated processes, including this repo's own GitHub Actions
    # runner, more than once). Playwright/Chrome is the heavy part here.
    mem_limit: "3g"

  # Fronts NVIDIA NIM's free-tier models (Nemotron, nemotron-3-ultra) behind
  # an Anthropic-compatible /v1/messages endpoint. This is the default
  # backend for every `claude` call in the career-ops container (see that
  # service's ANTHROPIC_* env vars above) -- cron jobs, discover-companies.sh,
  # AND the web UI's own Ask chat, since there's no interactive login
  # available in this headless container. See deploy/litellm/README.md.
  litellm:
    # -database variant runs the Prisma migration on boot and enables the
    # /ui admin panel (key management, spend tracking) -- needs the DB below.
    image: ghcr.io/berriai/litellm-database:main-stable
    container_name: career-ops-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4001:4000"
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm}@litellm-db:5432/litellm
    depends_on:
      litellm-db:
        condition: service_healthy
    restart: unless-stopped
    # litellm's embedded Prisma query-engine has been observed ballooning
    # to 9.4-9.7GB during mid-stream-fallback handling and OOM-killing
    # unrelated host processes (including this repo's own Actions runner)
    # -- cap it well above normal operation (~1-4GB observed) but below
    # that runaway pattern.
    mem_limit: "6g"

  # Internal-only -- no host port mapping, nothing outside the Docker network
  # can reach it. Backs the litellm admin UI (/ui) and its key/spend tables.
  litellm-db:
    image: postgres:16-alpine
    container_name: career-ops-litellm-db
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD:-litellm}
    volumes:
      - career-ops-litellm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: "512m"

  # Read-only infra dashboard -- LiteLLM model health/usage, discovery-scan
  # status, container status. See monitor/README.md. Reaches litellm over
  # this compose network directly (LITELLM_BASE_URL below); scan/container
  # status come from the mounted docker socket instead of SSH, since this
  # container now runs on the same host as everything it's watching.
  #
  # SECURITY NOTE: the docker socket mount gives this container control
  # over every container on the host, not just career-ops's own three --
  # docker socket access is root-equivalent host access. Accepted here
  # because this is a personal single-user host and the alternative (a
  # scoped docker API proxy) is real infra for a read-only dev tool. Don't
  # copy this mount into anything multi-tenant or internet-facing.
  monitor:
    build:
      context: ./monitor
      dockerfile: Dockerfile
    image: career-ops-monitor:local
    container_name: career-ops-monitor
    # Host 4002 -> container 3000 (4000 is career-ops's web UI, 4001 is
    # litellm's host-mapped port).
    ports:
      - "4002:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
    depends_on:
      - litellm
    restart: unless-stopped
    mem_limit: "512m"

volumes:
  career-ops-node-modules:
  career-ops-web-node-modules:
  career-ops-litellm-db:
