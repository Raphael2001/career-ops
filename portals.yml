# ── Job Boards ────────────────────────────────────────────────────────
# Multi-employer aggregators. Unlike tracked_companies (one entry = one employer),
# job boards return offers from many companies in a single API call.
# Same title/location filtering and dedup apply.

job_boards:

  # ── SolidJobs (Polish market) ──────────────────────────────────────
  # Public API — no auth needed. Division in URL path, campaign=career-ops for tracking.
  # Available divisions: it, engineering, marketing, sales, hr, logistics, finances, other

  - name: SolidJobs IT
    careers_url: https://solid.jobs/public-api/offers/it?campaign=career-ops
    provider: solidjobs
    enabled: true
    notes: "Polish IT job board — IT division"

  - name: SolidJobs Engineering
    careers_url: https://solid.jobs/public-api/offers/engineering?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — Engineering & Production division"

  - name: SolidJobs Marketing
    careers_url: https://solid.jobs/public-api/offers/marketing?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — Marketing division"

  - name: SolidJobs Sales
    careers_url: https://solid.jobs/public-api/offers/sales?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — Sales division"

  - name: SolidJobs HR
    careers_url: https://solid.jobs/public-api/offers/hr?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — HR division"

  - name: SolidJobs Logistics
    careers_url: https://solid.jobs/public-api/offers/logistics?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — Logistics division"

  - name: SolidJobs Finances
    careers_url: https://solid.jobs/public-api/offers/finances?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — Finances division"

  - name: SolidJobs Other
    careers_url: https://solid.jobs/public-api/offers/other?campaign=career-ops
    provider: solidjobs
    enabled: false
    notes: "Polish job board — Other specialists division"

  # ── JustJoin.it / NoFluffJobs (Polish tech market) ────────────────────────
  # Public job-board APIs. Disabled by default; enable and rely on the global
  # title_filter/location_filter/salary_filter above for your target profile.

  - name: JustJoin.it
    careers_url: https://justjoin.it/job-offers/all-locations
    provider: justjoin
    enabled: false
    notes: "Polish tech job board — newest public offers"

  - name: NoFluffJobs
    careers_url: https://nofluffjobs.com/pl
    provider: nofluffjobs
    enabled: false
    notes: "Polish tech job board — newest public postings"

  # -- Indonesia job boards (provider: jobstreet / glints) --

  - name: Jobstreet Indonesia
    provider: jobstreet
    api: https://id.jobstreet.com/api/jobsearch/v5/search
    siteKey: ID-Main
    searchKeywords: "data scientist"
    searchLocation: "Jakarta"
    pageSize: 30
    maxPages: 3
    enabled: false
    notes: "Indonesia's largest job board (SEEK group). Uses SEEK v5 JobSearch API — zero tokens."

  - name: Glints Indonesia
    provider: glints
    api: https://glints.com/api/v2-alc/graphql       # searchJobsV3 endpoint
    searchKeywords: "data scientist"
    countryCode: ID
    pageSize: 30
    maxPages: 3
    enabled: false
    notes: "SEA job platform covering ID/SG/MY/VN. Uses searchJobsV3 GraphQL endpoint (v2-alc). WAF blocks non-browser requests — works best from Playwright context."

  # ── HigherEdJobs (university / higher-ed RSS) ────────────────────────
  # Public no-auth RSS category feed. cat_id selects the HigherEdJobs
  # category. Common ones:
  #   68 = Higher Education, 64 = Educational Administration, 22 = Career Development
  # Full list: https://www.higheredjobs.com/rss/

  # - name: HigherEdJobs — Higher Education
  #   provider: higheredjobs
  #   cat_id: 68
  #   enabled: true

  # ── Getro — VC portfolio "talent network" boards ───────────────────
  # One board aggregates jobs across a fund's portfolio companies (each job
  # belongs to the portfolio company, not the fund). `careers_url` is
  # required — it also supplies the referer header the search API needs.
  # `getro_collection` (the board's numeric network id, the `network.id` in
  # the board page's __NEXT_DATA__) is optional: omit it and the id
  # auto-resolves from `careers_url` on first fetch; set it to skip that
  # lookup. Optional knobs: `getro_max_pages` (default 40, hard-capped at
  # 1500), `getro_max_age_days` (default 90, a pagination bound — newest-first,
  # stops once postings cross the age).

  - name: b2venture (portfolio)
    careers_url: https://jobs.b2venture.vc/jobs
    provider: getro
    getro_collection: 4283
    enabled: false
    notes: "Swiss VC portfolio board (Getro)"

  - name: Cherry Ventures (portfolio)
    careers_url: https://talent.cherry.vc/jobs
    provider: getro
    getro_collection: 44081
    enabled: false
    notes: "VC portfolio board (Getro)"

  - name: Atomico (portfolio)          # London. Pan-European growth-stage VC, $5B+ AUM,
                                        # 200+ portfolio companies (Klarna, Lime, Hinge Health among alumni).
    careers_url: https://careers.atomico.com/jobs
    provider: getro
    # getro_collection left out on purpose — auto-resolves from careers_url on first fetch
    enabled: false
    notes: "VC portfolio board (Getro), collection_id auto-resolved"

  - name: Earlybird Venture Capital (portfolio)   # Berlin. Founded 1997, ~€2.5B AUM across fund streams,
                                                   # one of Europe's oldest and most active VCs (fintech/insurtech, enterprise software, deep tech).
    careers_url: https://jobs.earlybird.com/jobs
    provider: getro
    enabled: false
    notes: "German VC portfolio board (Getro), collection_id auto-resolved"

  - name: Speedinvest (portfolio)      # Vienna. Pan-European/CEE early-stage VC, ~€1B+ AUM,
                                        # ~250 portfolio companies (wikifolio, Bitmovin, byrd) — strong DACH presence.
    careers_url: https://careers.speedinvest.com/jobs
    provider: getro
    enabled: false
    notes: "DACH-region VC portfolio board (Getro), collection_id auto-resolved"

  - name: HV Capital (portfolio)       # Munich/Berlin. One of Europe's largest early-to-growth VCs,
                                        # ~€2.8B AUM, 200+ portfolio companies (Zalando, HelloFresh, Delivery Hero, FlixBus).
    careers_url: https://hv.getro.com/jobs
    provider: getro
    enabled: false
    notes: "VC portfolio board (Getro), collection_id auto-resolved"

  - name: Point Nine (portfolio)       # Berlin. Early-stage "angel-VC" for B2B SaaS/AI, smaller fund (~$550M AUM),
                                        # ~90 portfolio companies (early Zendesk, Algolia, Contentful, Revolut rounds).
    careers_url: https://jobs.pointnine.com/jobs
    provider: getro
    enabled: false
    notes: "VC portfolio board (Getro), collection_id auto-resolved"

  - name: Insight Partners (portfolio)  # New York. Global growth-equity/VC, one of the largest tech-focused funds,
                                         # 500+ portfolio companies worldwide.
    careers_url: https://jobs.insightpartners.com/jobs
    provider: getro
    getro_max_pages: 700   # large global board — raise the default page cap to reach deeper pages
    enabled: false
    notes: "VC portfolio board (Getro), collection_id auto-resolved"

  # ── Consider (getconsider.com) — VC portfolio boards ───────────────
  # JS board backed by a same-origin JSON API. Set `consider_board` to the
  # board id — NOT the host (Founderful's board id is "wingman"). `careers_url`
  # supplies the board origin. Optional: `consider_size` (default 500).

  - name: Founderful (portfolio)
    careers_url: https://jobs.founderful.com/jobs
    provider: consider
    consider_board: wingman
    enabled: false
    notes: "Swiss VC portfolio board (Consider)"

  # ── Swiss startup job boards ───────────────────────────────────────
  # Aggregators of Swiss startup roles. No extra config — auto-detected from
  # the careers_url host.


  - name: joinup.ch
    careers_url: https://joinup.ch/browse/jobs
    provider: joinup
    enabled: false
    notes: "Swiss startup job platform (newest SSR page)"
  # ── CryptocurrencyJobs (Web3 / crypto) ─────────────────────────────
  # Curated Web3/crypto job board. Public RSS feed, zero-auth, 100% remote
  # listings. The feed URL is hardcoded in the provider — no careers_url
  # or api field needed.

  # - name: CryptocurrencyJobs             # curated Web3/crypto board (RSS, all-remote)
  #   provider: cryptocurrencyjobs
  #   enabled: true
