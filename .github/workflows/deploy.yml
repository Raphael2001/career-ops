name: Deploy to linux-claw

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, career-ops]
    steps:
      - name: Pull latest and rebuild
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_MODELS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          cd ~/career-ops
          OLD_SHA="$(git rev-parse HEAD)"
          git fetch origin main

          # portals.yml (tracked in git) gets written to live by the
          # in-container discovery cron -- a plain `reset --hard` here would
          # silently discard whatever it's found mid-run (this actually
          # happened once: a deploy landed while a scan was upgrading
          # companies to real ATS APIs, and reset --hard wiped all of it
          # before it ever got committed). Stash any uncommitted local
          # changes first, reset to the new code, then reapply them on top.
          git stash push -u -m "pre-deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git reset --hard origin/main
          git stash pop || echo "::warning::stash pop failed or had nothing to pop -- check 'git stash list' on the server"
          NEW_SHA="$(git rev-parse HEAD)"

          # Sync secrets into .env (repo secrets -> host .env), leaving any
          # other lines untouched. No-op for a key that isn't set as a
          # repo secret, so .env keeps whatever was there before.
          touch .env
          for key in NVIDIA_API_KEY GROQ_API_KEY OPENROUTER_API_KEY ZAI_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MISTRAL_API_KEY LITELLM_MASTER_KEY; do
            value="${!key}"
            [ -z "$value" ] && continue
            grep -v "^${key}=" .env > .env.tmp || true
            echo "${key}=${value}" >> .env.tmp
            mv .env.tmp .env
          done

          # `./cops rebuild` always recreates the career-ops container --
          # which kills any discovery scan running at that moment (this
          # happened repeatedly). A rebuild is only genuinely needed when
          # something that affects the IMAGE or a container's fixed config
          # changed: Dockerfile (system packages), docker-compose.yml (env
          # vars/ports/volumes are set at container-creation time, not
          # bind-mount-live), or a package.json/package-lock.json (new
          # dependencies node_modules doesn't have yet) for ANY service --
          # monitor's own package.json is included here for the same reason
          # web's is (#confirmed: monitor's yarn install --immutable had no
          # coverage here before, so a monitor-only dependency bump would
          # silently never rebuild).
          #
          # Below that, plain source changes under `web/` still need a
          # RESTART even though `.` is bind-mounted: career-ops runs `next
          # start` (a compiled production server, forced by container-start.sh
          # for its own documented reasons), not `next dev` -- there is no
          # hot reload. `container-start.sh` reruns `next build` fresh on
          # every container boot, so a plain restart (cheap, no image
          # rebuild, ~20s) is enough to pick up a route/component/lib change.
          # (Confirmed live: a portals.yml-save bugfix landed via this exact
          # path and silently never took effect until the container was
          # restarted by hand -- the assumption that source changes were
          # "already live via the bind mount" was wrong for anything under
          # web/ that isn't a bare script.)
          REBUILD_TRIGGERS='^(Dockerfile|docker-compose\.yml|package(-lock)?\.json|web/package(-lock)?\.json|monitor/package(-lock)?\.json)$'
          CHANGED="$(git diff --name-only "$OLD_SHA" "$NEW_SHA" 2>/dev/null || true)"
          if [ "$OLD_SHA" != "$NEW_SHA" ] && echo "$CHANGED" | grep -qE "$REBUILD_TRIGGERS"; then
            echo "Image-affecting file changed -- rebuild needed."
            if docker compose exec -T career-ops sh -c 'flock -n /tmp/discover-companies-native.lock -c true' 2>/dev/null; then
              echo "No discovery scan running -- safe rebuild."
            else
              echo "::warning::A discovery scan is running right now -- this rebuild will kill it mid-run (progress already made is safe on disk; it'll just need re-running, either manually or at tonight's cron)."
            fi
            ./cops rebuild
          elif [ "$OLD_SHA" != "$NEW_SHA" ] && echo "$CHANGED" | grep -qE '^web/'; then
            echo "web/ source changed -- restarting career-ops to pick it up (next start doesn't hot-reload)."
            if docker compose exec -T career-ops sh -c 'flock -n /tmp/discover-companies-native.lock -c true' 2>/dev/null; then
              echo "No discovery scan running -- safe restart."
            else
              echo "::warning::A discovery scan is running right now -- this restart will kill it mid-run (progress already made is safe on disk; it'll just need re-running, either manually or at tonight's cron)."
            fi
            docker compose restart career-ops
          else
            echo "No web/image-affecting files changed -- nothing to restart."
          fi

          # deploy/litellm/config.yaml is bind-mounted read-only into the
          # litellm service (docker-compose.yml) -- litellm reads it once at
          # process startup, so an on-disk content change alone (no compose
          # service-definition change) does NOT get picked up by `docker
          # compose up -d`, and it isn't covered by REBUILD_TRIGGERS or the
          # web/ restart branch above since litellm is a separate service.
          # Restart it explicitly whenever the file changes. This is
          # independent of the career-ops rebuild/restart decision above --
          # restarting litellm doesn't touch the career-ops container or any
          # discovery scan running inside it.
          if [ "$OLD_SHA" != "$NEW_SHA" ] && echo "$CHANGED" | grep -qE '^deploy/litellm/config\.yaml$'; then
            echo "deploy/litellm/config.yaml changed -- restarting litellm to pick it up."
            docker compose restart litellm
          fi

          ./cops doctor
