name: Deploy to linux-claw

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, career-ops]
    steps:
      - name: Pull latest and rebuild
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_MODELS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          cd ~/career-ops
          OLD_SHA="$(git rev-parse HEAD)"
          git fetch origin main

          # portals.yml (tracked in git) gets written to live by the
          # in-container discovery cron -- a plain `reset --hard` here would
          # silently discard whatever it's found mid-run (this actually
          # happened once: a deploy landed while a scan was upgrading
          # companies to real ATS APIs, and reset --hard wiped all of it
          # before it ever got committed). Stash any uncommitted local
          # changes first, reset to the new code, then reapply them on top.
          git stash push -u -m "pre-deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git reset --hard origin/main
          git stash pop || echo "::warning::stash pop failed or had nothing to pop -- check 'git stash list' on the server"
          NEW_SHA="$(git rev-parse HEAD)"

          # Sync secrets into .env (repo secrets -> host .env), leaving any
          # other lines untouched. No-op for a key that isn't set as a
          # repo secret, so .env keeps whatever was there before.
          touch .env
          for key in NVIDIA_API_KEY GROQ_API_KEY OPENROUTER_API_KEY ZAI_API_KEY LITELLM_MASTER_KEY; do
            value="${!key}"
            [ -z "$value" ] && continue
            grep -v "^${key}=" .env > .env.tmp || true
            echo "${key}=${value}" >> .env.tmp
            mv .env.tmp .env
          done

          # `./cops rebuild` always recreates the career-ops container --
          # which kills any discovery scan running at that moment (this
          # happened repeatedly). Most deploys don't actually need it: `.` is
          # bind-mounted into the container, so a plain script/route/provider
          # change is ALREADY live the instant `git reset --hard` above
          # touches the file on disk -- no restart required -- and the web
          # UI's Next dev server hot-reloads its own source on file change by
          # itself. A rebuild is only genuinely needed when something that
          # affects the IMAGE or the container's fixed config changed:
          # Dockerfile (system packages), docker-compose.yml (env vars/ports/
          # volumes are set at container-creation time, not bind-mount-live),
          # or a package.json/package-lock.json (new dependencies node_modules
          # doesn't have yet).
          REBUILD_TRIGGERS='^(Dockerfile|docker-compose\.yml|package(-lock)?\.json|web/package(-lock)?\.json)$'
          if [ "$OLD_SHA" != "$NEW_SHA" ] && git diff --name-only "$OLD_SHA" "$NEW_SHA" | grep -qE "$REBUILD_TRIGGERS"; then
            echo "Image-affecting file changed -- rebuild needed."
            if docker compose exec -T career-ops sh -c 'flock -n /tmp/discover-companies-native.lock -c true' 2>/dev/null; then
              echo "No discovery scan running -- safe rebuild."
            else
              echo "::warning::A discovery scan is running right now -- this rebuild will kill it mid-run (progress already made is safe on disk; it'll just need re-running, either manually or at tonight's cron)."
            fi
            ./cops rebuild
          else
            echo "No image-affecting files changed -- skipping rebuild, code is already live via the bind mount (any running discovery scan is untouched)."
          fi

          ./cops doctor
