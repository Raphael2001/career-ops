name: Deploy to linux-claw

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, career-ops]
    steps:
      - name: Pull latest and rebuild
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          cd ~/career-ops
          git fetch origin main

          # portals.yml (tracked in git) gets written to live by the
          # in-container discovery cron -- a plain `reset --hard` here would
          # silently discard whatever it's found mid-run (this actually
          # happened once: a deploy landed while a scan was upgrading
          # companies to real ATS APIs, and reset --hard wiped all of it
          # before it ever got committed). Stash any uncommitted local
          # changes first, reset to the new code, then reapply them on top.
          git stash push -u -m "pre-deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git reset --hard origin/main
          git stash pop || echo "::warning::stash pop failed or had nothing to pop -- check 'git stash list' on the server"

          # Sync secrets into .env (repo secrets -> host .env), leaving any
          # other lines untouched. No-op for a key that isn't set as a
          # repo secret, so .env keeps whatever was there before.
          touch .env
          for key in NVIDIA_API_KEY LITELLM_MASTER_KEY; do
            value="${!key}"
            [ -z "$value" ] && continue
            grep -v "^${key}=" .env > .env.tmp || true
            echo "${key}=${value}" >> .env.tmp
            mv .env.tmp .env
          done

          # `./cops rebuild` always recreates the career-ops container,
          # regardless of what changed -- which kills any discovery scan
          # that happens to be running at that exact moment, with zero error
          # output (the process just vanishes; this cost real hours to
          # diagnose the first time, tracing it back to "which deploy landed
          # right as it died"). Not blocking the deploy for it -- the scan is
          # resumable (portals.yml/pipeline.md progress already persisted)
          # and code fixes shouldn't wait on a job that can run for most of a
          # day -- just making the interruption visible in THIS run's own
          # log instead of a silent mystery days later.
          if docker compose exec -T career-ops sh -c 'flock -n /tmp/discover-companies-native.lock -c true' 2>/dev/null; then
            echo "No discovery scan running -- safe rebuild."
          else
            echo "::warning::A discovery scan is running right now -- this rebuild will kill it mid-run (progress already made is safe on disk; it'll just need re-running, either manually or at tonight's cron)."
          fi

          ./cops rebuild
          ./cops doctor
